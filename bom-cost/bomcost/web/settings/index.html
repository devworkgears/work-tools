<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>設定</title>
<link rel="stylesheet" href="/v2.css">
<style>
  .app { max-width: 720px; }
  .set th { text-align: left; font-weight: 400; padding: 4px 16px 4px 0; white-space: nowrap; }
  .set td { padding: 4px 8px 4px 0; }
  .set td.mini { white-space: normal; }
  .set th.group { font-weight: 700; padding-top: 14px; }
  .card > .b { padding: 10px 12px; }
  .note { min-height: 1.5em; font-weight: 600; }
  .note.bad { color: var(--warn); }
</style>
</head>
<body>
<div class="app">
  <div class="top"><span class="brand">設定</span><span class="mini" id="file"></span></div>
  <div class="row modebar">
    <button class="btn pri" id="save">保存</button>
    <span class="mini">変えて保存すると、取り込んだ部品表を消します</span>
    <span class="sp"></span>
    <button class="btn" id="load">json を読み込む</button>
    <button class="btn" id="export">json を書き出す</button>
    <input type="file" id="pick" accept=".json,application/json" hidden>
  </div>
  <div class="note" id="msg" role="status"></div>
  <div class="card"><div class="h">値</div><div class="b"><table class="set" id="values"></table></div></div>
  <div class="card"><div class="h">語の読み替え<span class="mini">画面と Excel の見出し。空はそのまま</span></div>
    <div class="b"><table class="set" id="words"></table></div></div>
  <div class="card"><div class="h">ほかの語の読み替え<span class="mini">画面の文字とまるごと同じ語</span></div>
    <div class="b"><table class="set" id="labels"></table></div></div>
</div>
<script src="settings.js"></script>
</body>
</html>
