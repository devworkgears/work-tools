<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>運転範囲 可視化ツール</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>運転範囲<br>可視化ツール</h1>

      <section>
        <h2>データ入力</h2>
        <label class="btn primary">
          Excelを読み込む
          <input type="file" id="file-input" accept=".xlsx,.xlsm" hidden>
        </label>
        <div class="btn-row">
          <button type="button" class="btn" id="btn-sample">サンプル表示</button>
          <button type="button" class="btn" id="btn-template">テンプレDL</button>
        </div>
        <div id="file-name" class="muted"></div>
      </section>

      <section>
        <h2>表示モード</h2>
        <label class="radio"><input type="radio" name="mode" value="individual" checked> 個別モデル</label>
        <label class="radio"><input type="radio" name="mode" value="envelope"> グループ外包</label>
        <div id="envelope-config" hidden>
          <label class="row">集約軸
            <select id="envelope-by"></select>
          </label>
          <div class="row indent">
            <label class="radio"><input type="radio" name="envelope-method" value="union" checked> 合併境界</label>
            <label class="radio"><input type="radio" name="envelope-method" value="hull"> 凸包</label>
          </div>
        </div>
      </section>

      <section>
        <h2>フィルタ</h2>
        <div id="filters" class="muted">データ未読み込み</div>
      </section>

      <section>
        <h2>軸範囲(空欄=自動)</h2>
        <div class="axis-grid">
          <label>Q最小 <input type="number" id="axis-xmin" step="any" min="0"></label>
          <label>Q最大 <input type="number" id="axis-xmax" step="any" min="0"></label>
          <label>H最小 <input type="number" id="axis-ymin" step="any" min="0"></label>
          <label>H最大 <input type="number" id="axis-ymax" step="any" min="0"></label>
        </div>
        <button type="button" class="btn mini" id="btn-axis-reset">自動に戻す</button>
      </section>

      <section>
        <h2>実図デジタイザ</h2>
        <label class="btn">
          実図画像を開く
          <input type="file" id="digi-image" accept="image/*" hidden>
        </label>
        <div id="digi-body" hidden>
          <label class="row">不透明度
            <input type="range" id="digi-opacity" min="0" max="100" value="50">
          </label>
          <div class="digi-block">
            <div class="digi-title">① 較正</div>
            <div class="row">
              <select id="digi-qscale">
                <option value="log">Q軸: 対数</option>
                <option value="linear">Q軸: リニア</option>
              </select>
              <select id="digi-hscale">
                <option value="log">H軸: 対数</option>
                <option value="linear">H軸: リニア</option>
              </select>
            </div>
            <div class="axis-grid">
              <label>点1 Q <input type="number" id="digi-q1" step="any" min="0"></label>
              <label>点1 H <input type="number" id="digi-h1" step="any" min="0"></label>
              <label>点2 Q <input type="number" id="digi-q2" step="any" min="0"></label>
              <label>点2 H <input type="number" id="digi-h2" step="any" min="0"></label>
            </div>
            <div class="btn-row">
              <button type="button" class="btn" id="digi-set1">点1をクリック指定</button>
              <button type="button" class="btn" id="digi-set2">点2をクリック指定</button>
            </div>
            <div id="digi-calib-status" class="muted">未較正</div>
          </div>
          <div class="digi-block">
            <div class="digi-title">② 点の採取</div>
            <label class="row">モデル名 <input type="text" id="digi-model" placeholder="PA-5.5"></label>
            <label class="row">カーブ
              <select id="digi-curve">
                <option value="upper">upper</option>
                <option value="lower">lower</option>
              </select>
            </label>
            <label class="radio"><input type="checkbox" id="digi-capture"> 採取モードON</label>
            <div id="digi-count" class="muted">採取点 0</div>
            <div class="btn-row">
              <button type="button" class="btn" id="digi-undo">1点戻す</button>
              <button type="button" class="btn" id="digi-clear">全消去</button>
            </div>
            <button type="button" class="btn" id="digi-export">採取点をExcel出力</button>
          </div>
        </div>
      </section>

      <section>
        <h2>出力</h2>
        <div class="btn-row">
          <button type="button" class="btn" id="btn-svg">SVG</button>
          <button type="button" class="btn" id="btn-png">PNG</button>
        </div>
      </section>

      <footer class="muted">
        <div id="app-version">dev版</div>
      </footer>
    </aside>

    <main id="main">
      <div id="errors" hidden></div>
      <div id="chart-wrap">
        <svg id="chart"></svg>
        <div id="tooltip" hidden></div>
        <div id="empty-hint"></div>
      </div>
      <div id="status-bar"><span id="status-left"></span><span id="status-coords"></span></div>
    </main>
  </div>

  <script src="./src/vendor/d3.v7.min.js"></script>
  <script src="./src/vendor/xlsx.full.min.js"></script>
  <script type="module" src="./src/ui/main.js"></script>
</body>
</html>
